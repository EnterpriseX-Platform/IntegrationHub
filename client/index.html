<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <title>IntegrationX</title>
    <script>
      // Carbon theme: light (g10) by default like IAMX, remembered per browser
      (function () {
        var t = 'light';
        try { t = localStorage.getItem('theme') || 'light'; } catch (e) {}
        document.documentElement.dataset.theme = t;
        // Carbon theme class: g10 (light) / g100 (dark)
        document.documentElement.classList.add(t === 'dark' ? 'cds--g100' : 'cds--g10');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
